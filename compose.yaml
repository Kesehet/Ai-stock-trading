services:
  trader:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-stock-trading:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_MODE: ${APP_MODE:-paper}
      LIVE_TRADING_ARMED: ${LIVE_TRADING_ARMED:-false}
    volumes:
      - trader-data:/var/lib/ai-stock-trading
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  trader-data:
