name: Deploy Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Hostinger compose
        env:
          APP_MODE: paper
          DASHBOARD_HOST_PORT: "18080"
        run: docker compose -f compose.hostinger.yaml config

      - name: Deploy isolated Hostinger Docker project
        uses: hostinger/deploy-on-vps@b0868cec74bfa63af6bfa7bdb0dfee2f9bef13ea # v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: "1058562"
          project-name: ai-stock-trading
          docker-compose-path: compose.hostinger.yaml
          environment-variables: |
            APP_MODE=paper
            OLLAMA_BASE_URL=http://ollama:11434
            OLLAMA_MODEL=gpt-oss:120b
            STARTING_CASH=500000
            MAX_POSITION_PCT=0.05
            MAX_DAILY_LOSS_PCT=0.01
            MAX_OPEN_POSITIONS=10
            RUNTIME_POLL_SECONDS=10
            DASHBOARD_HOST_PORT=18080
            DASHBOARD_ADMIN_TOKEN=${{ secrets.DASHBOARD_ADMIN_TOKEN }}
            LIVE_TRADING_ARMED=false
            LIVE_TRADING_CONFIRMATION=
            ZERODHA_API_KEY=${{ secrets.ZERODHA_API_KEY }}
            ZERODHA_API_SECRET=${{ secrets.ZERODHA_API_SECRET }}

      - name: Wait for Hostinger containers to become healthy
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
        run: |
          set -euo pipefail
          URL="https://developers.hostinger.com/api/vps/v1/virtual-machines/1058562/docker/ai-stock-trading/containers"

          for attempt in $(seq 1 30); do
            RESPONSE=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $HOSTINGER_API_KEY" \
              "$URL")

            COUNT=$(echo "$RESPONSE" | jq 'length')
            SUMMARY=$(echo "$RESPONSE" | jq -r '[.[] | "\(.name): state=\(.state), health=\(.health // "n/a"), status=\(.status)"] | join(" | ")')
            echo "Attempt $attempt/30: containers=$COUNT ${SUMMARY:+| $SUMMARY}"

            FAILED=$(echo "$RESPONSE" | jq '[.[] | select(.state == "exited" or .state == "dead" or .health == "unhealthy")] | length')
            if [ "$FAILED" -gt 0 ]; then
              echo "A Hostinger container entered a failed/unhealthy state." >&2
              echo "$RESPONSE" | jq .
              exit 1
            fi

            if echo "$RESPONSE" | jq -e 'length >= 2 and all(.[]; .state == "running" and (.health == null or .health == "" or .health == "healthy" or .health == "starting"))' >/dev/null; then
              echo "Hostinger project ai-stock-trading is running."
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for Hostinger project ai-stock-trading." >&2
          curl --silent --show-error \
            -H "Authorization: Bearer $HOSTINGER_API_KEY" \
            "https://developers.hostinger.com/api/vps/v1/virtual-machines/1058562/docker/ai-stock-trading/logs" || true
          exit 1
