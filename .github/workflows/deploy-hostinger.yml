name: Deploy Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Hostinger compose
        env:
          APP_MODE: paper
          DASHBOARD_HOST_PORT: "18080"
          TRADING_WATCHLIST: ""
        run: docker compose -f compose.hostinger.yaml config

      - name: Capture current Hostinger container generation
        id: previous
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
        run: |
          set -euo pipefail
          URL="https://developers.hostinger.com/api/vps/v1/virtual-machines/1058562/docker/ai-stock-trading/containers"
          RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $HOSTINGER_API_KEY" \
            "$URL" || echo '[]')
          IDS=$(echo "$RESPONSE" | jq -r 'map(.id) | join(",")')
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "Existing container generation: ${IDS:-none}"

      - name: Deploy isolated Hostinger Docker project
        uses: hostinger/deploy-on-vps@b0868cec74bfa63af6bfa7bdb0dfee2f9bef13ea # v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: "1058562"
          project-name: ai-stock-trading
          docker-compose-path: compose.hostinger.yaml
          environment-variables: |
            APP_MODE=paper
            OLLAMA_BASE_URL=https://ollama.com
            OLLAMA_MODEL=gpt-oss:120b
            OLLAMA_API_KEY=${{ secrets.OLLAMA_API_KEY }}
            STARTING_CASH=500000
            MAX_POSITION_PCT=0.05
            MAX_DAILY_LOSS_PCT=0.01
            MAX_OPEN_POSITIONS=10
            MIN_BUY_CONFIDENCE=0.60
            PAPER_SLIPPAGE_BPS=5
            TRADING_WATCHLIST=
            DECISION_INTERVAL_SECONDS=900
            QUOTE_POLL_SECONDS=10
            MAX_AI_CANDIDATES=5
            UNIVERSE_HISTORY_DAYS=90
            UNIVERSE_MIN_PRICE=20
            UNIVERSE_MIN_HISTORY_BARS=20
            UNIVERSE_MIN_AVG_TRADED_VALUE=50000000
            UNIVERSE_SCAN_LIMIT=100
            RUNTIME_POLL_SECONDS=10
            DASHBOARD_HOST_PORT=18080
            DASHBOARD_ADMIN_TOKEN=${{ secrets.DASHBOARD_ADMIN_TOKEN }}
            ZERODHA_API_KEY=${{ secrets.ZERODHA_API_KEY }}
            ZERODHA_API_SECRET=${{ secrets.ZERODHA_API_SECRET }}

      - name: Wait for new Hostinger containers to become healthy
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          PREVIOUS_IDS: ${{ steps.previous.outputs.ids }}
        run: |
          set -euo pipefail
          URL="https://developers.hostinger.com/api/vps/v1/virtual-machines/1058562/docker/ai-stock-trading/containers"

          # Hostinger replaces containers asynchronously. Old containers becoming
          # dead/exited is normal during rollout; only judge containers whose IDs
          # are not part of the pre-deploy generation.
          sleep 10

          for attempt in $(seq 1 48); do
            RESPONSE=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $HOSTINGER_API_KEY" \
              "$URL")

            NEW_RESPONSE=$(echo "$RESPONSE" | jq --arg previous "$PREVIOUS_IDS" '
              ($previous | split(",") | map(select(length > 0))) as $old |
              [.[] | select(.id as $id | ($old | index($id) | not))]
            ')
            NEW_COUNT=$(echo "$NEW_RESPONSE" | jq 'length')
            SUMMARY=$(echo "$RESPONSE" | jq -r '[.[] | "\(.name): id=\(.id), state=\(.state), health=\(.health // "n/a"), status=\(.status)"] | join(" | ")')
            echo "Attempt $attempt/48: new_containers=$NEW_COUNT ${SUMMARY:+| $SUMMARY}"

            NEW_FAILED=$(echo "$NEW_RESPONSE" | jq '[.[] | select(.state == "exited" or .state == "dead" or .health == "unhealthy")] | length')
            if [ "$NEW_FAILED" -gt 0 ]; then
              echo "A new Hostinger container entered a failed/unhealthy state." >&2
              echo "$NEW_RESPONSE" | jq .
              curl --silent --show-error \
                -H "Authorization: Bearer $HOSTINGER_API_KEY" \
                "https://developers.hostinger.com/api/vps/v1/virtual-machines/1058562/docker/ai-stock-trading/logs" || true
              exit 1
            fi

            if echo "$NEW_RESPONSE" | jq -e '
              length >= 2 and
              all(.[]; .state == "running" and (.health == null or .health == "" or .health == "healthy"))
            ' >/dev/null; then
              echo "Hostinger project ai-stock-trading is running on a new healthy container generation."
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for a new healthy Hostinger container generation." >&2
          echo "Previous generation: ${PREVIOUS_IDS:-none}" >&2
          curl --silent --show-error \
            -H "Authorization: Bearer $HOSTINGER_API_KEY" \
            "https://developers.hostinger.com/api/vps/v1/virtual-machines/1058562/docker/ai-stock-trading/logs" || true
          exit 1

      - name: Capture initial paper-fund activity
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
        run: |
          set -euo pipefail
          # Give the first market-open decision cycle time to complete. This is
          # observability only: a HOLD or risk rejection is a valid paper result.
          sleep 45
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $HOSTINGER_API_KEY" \
            "https://developers.hostinger.com/api/vps/v1/virtual-machines/1058562/docker/ai-stock-trading/logs" \
            | jq -r '
              .[]
              | select(.service == "trader-1")
              | .entries[-120:]
              | .[]
              | "\(.timestamp // "") \(.line // "")"
            '
