name: Fund Telemetry

on:
  schedule:
    # IST has no DST: 09:00, 13:00, 15:45 IST on weekdays.
    - cron: "30 3 * * 1-5"
    - cron: "30 7 * * 1-5"
    - cron: "15 10 * * 1-5"
  workflow_dispatch:
  # Temporary verification trigger. Diagnostic refresh: 2026-08-28 16:11 IST.
  push:
    paths:
      - ".github/workflows/fund-telemetry.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Fetch and summarize deep fund telemetry
        shell: bash
        env:
          TELEMETRY_TOKEN: ${{ secrets.DASHBOARD_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          BASE_URL="https://ai-stock-trading.srv1058562.hstgr.cloud"
          test -n "$TELEMETRY_TOKEN"
          curl --fail --silent --show-error --max-time 20 --retry 1 \
            -H "Authorization: Bearer $TELEMETRY_TOKEN" \
            "$BASE_URL/fund-status.json" -o fund-status.json
          curl --fail --silent --show-error --max-time 20 --retry 1 \
            -H "Authorization: Bearer $TELEMETRY_TOKEN" \
            "$BASE_URL/strategy-memory.json" -o strategy-memory.json
          jq -e . fund-status.json >/dev/null
          jq -e . strategy-memory.json >/dev/null

          # Publish only the diagnostic fields needed for remote analysis. The
          # authenticated endpoints remain the source of full raw logs/history.
          jq -c --slurpfile memory strategy-memory.json '
            {
              schema_version,
              generated_at,
              mode,
              market_phase,
              worker,
              safety,
              portfolio,
              paper_broker: {
                cash: .paper_broker.cash,
                positions: .paper_broker.positions,
                recent_orders: (.paper_broker.orders[:40]),
                realized_pnl: .paper_broker.realized_pnl,
                charges: .paper_broker.charges
              },
              position_diagnostics: {
                mark_updated_at: .position_diagnostics.mark_updated_at,
                positions: .position_diagnostics.positions,
                material_unrealized_losers: .position_diagnostics.material_unrealized_losers,
                unrealized_winners: .position_diagnostics.unrealized_winners,
                unrealized_pnl_total: .position_diagnostics.unrealized_pnl_total,
                measured_positions: .position_diagnostics.measured_positions,
                unmeasured_positions: .position_diagnostics.unmeasured_positions,
                recent_realized_trades: (.position_diagnostics.recent_realized_trades[:20])
              },
              trade_quality: {
                positions: .trade_quality.positions,
                measured_positions: .trade_quality.measured_positions,
                unmeasured_positions: .trade_quality.unmeasured_positions,
                immediate_adverse_entries: .trade_quality.immediate_adverse_entries,
                gave_back_winners: .trade_quality.gave_back_winners,
                by_entry_setup: .trade_quality.by_entry_setup
              },
              strategy_memory: ($memory[0].entries[:120]),
              runtime_state,
              diagnostics: {
                action_counts: .diagnostics.action_counts,
                category_counts: .diagnostics.category_counts,
                per_symbol_action_counts: .diagnostics.per_symbol_action_counts,
                recent_decisions: (.diagnostics.recent_decisions[:30]),
                recent_failures: (.diagnostics.recent_failures[:30]),
                recent_risk_events: (.diagnostics.recent_risk_events[:40]),
                recent_execution_events: (.diagnostics.recent_execution_events[:40]),
                recent_intraday_scans: (.diagnostics.recent_intraday_scans[:10]),
                recent_thesis_drift: (.diagnostics.recent_thesis_drift[:30]),
                error_log_excerpt: ([
                  .diagnostics.trader_log_tail[]
                  | select(test("ERROR|CRITICAL|Traceback|Exception|ValueError|HTTP [45][0-9][0-9]|failed|Failure"; "i"))
                ][-80:])
              },
              active_configuration
            }
          ' fund-status.json > diagnostic-summary.json

          echo "FUND_DIAGNOSTIC_JSON_BEGIN"
          cat diagnostic-summary.json
          echo
          echo "FUND_DIAGNOSTIC_JSON_END"

          {
            echo "### Fund diagnostic snapshot"
            echo
            jq -r '"Generated: \(.generated_at) | Mode: \(.mode) | Market: \(.market_phase) | NAV: ₹\(.portfolio.total_value) | P&L: ₹\(.portfolio.pnl_total) | Worker healthy: \(.worker.healthy)"' diagnostic-summary.json
            echo
            echo '```json'
            jq . diagnostic-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
