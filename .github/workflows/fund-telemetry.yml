name: Fund Telemetry

on:
  schedule:
    # IST has no DST: 09:00, 13:00, 15:45 IST on weekdays.
    - cron: "30 3 * * 1-5"
    - cron: "30 7 * * 1-5"
    - cron: "15 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Fetch deep fund telemetry
        shell: bash
        env:
          TELEMETRY_TOKEN: ${{ secrets.DASHBOARD_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          URL="https://ai-stock-trading.srv1058562.hstgr.cloud/fund-status.json"
          test -n "$TELEMETRY_TOKEN"
          curl --fail --silent --show-error --max-time 20 --retry 1 \
            -H "Authorization: Bearer $TELEMETRY_TOKEN" \
            "$URL" -o fund-status.json
          jq -e . fund-status.json >/dev/null
          echo "FUND_TELEMETRY_JSON_BEGIN"
          jq -c . fund-status.json
          echo "FUND_TELEMETRY_JSON_END"
          {
            echo "### Fund diagnostic snapshot"
            echo
            jq -r '"Generated: \(.generated_at) | Mode: \(.mode) | Market: \(.market_phase) | NAV: ₹\(.portfolio.total_value) | P&L: ₹\(.portfolio.pnl_total) | Worker healthy: \(.worker.healthy)"' fund-status.json
            echo
            echo '```json'
            jq '{generated_at,mode,market_phase,worker,safety,portfolio,diagnostics:{action_counts:.diagnostics.action_counts,per_symbol_action_counts:.diagnostics.per_symbol_action_counts,recent_failures:.diagnostics.recent_failures,recent_risk_events:.diagnostics.recent_risk_events,recent_execution_events:.diagnostics.recent_execution_events,recent_intraday_scans:.diagnostics.recent_intraday_scans},active_configuration}' fund-status.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
