[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-stock-trading"
version = "0.1.0"
description = "Autonomous Indian-equity research, risk, backtesting and paper/live trading platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-defusedxml>=0.7.0.20250822",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/autonomous_trader.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "app.autonomous_trader"
disable_error_code = ["arg-type"]

# Production intentionally enriches the base static intent builder with live
# scanner state. Python supports this instance-aware override; keep the narrow
# exception here instead of weakening strict typing for the rest of the app.
[[tool.mypy.overrides]]
module = "app.production_trader"
disable_error_code = ["override"]